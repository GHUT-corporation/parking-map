name: Publish Parking Map to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::error::Add the MAPTILER_KEY repository secret before deploying."
            exit 1
          fi
          mkdir -p dist/data
          cp index.html styles.css script.js map-config.js dist/
          cp data/ukraine-boundary.geojson dist/data/
          jq -cn --arg key "$MAPTILER_KEY" '{mapTilerKey:$key}' \
            | sed 's/^/window.PARKING_MAP_CONFIG = Object.freeze(/; s/$/);/' \
            > dist/map-config.js
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
